[package]
name = "zdesk"
version = "0.1.0"
edition = "2021"
description = "Lightweight transparent desktop widgets for Ubuntu GNOME XWayland"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
ttf-parser = "=0.25.1"
toml = { version = "=0.9.8", default-features = false, features = ["std", "serde", "parse"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["randr", "render", "shape"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
